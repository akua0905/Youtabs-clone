<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YouTabs Clone</title>

  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      margin: 0;
      padding: 24px;

      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    input[type="file"] {
      width: 100%;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      white-space: pre-wrap;
      margin-top: 20px;
      line-height: 1.6;
    }

    #download {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #007aff;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
    }

    .progress {
      margin-top: 15px;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width 0.2s;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>YouTabs Clone</h1>

  <p>
    音源をボーカルと伴奏に分離し、
    それぞれをMIDIに変換します。
  </p>

  <input
    id="audio"
    type="file"
    accept="audio/*"
  >

  <button id="convert">
    分離してMIDIに変換
  </button>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <div id="status">
    音源を選択してください。
  </div>

  <a id="download">
    ZIPを保存
  </a>

</div>

<script
  type="module"
  src="./src/main.js"
></script>

</body>
</html>
